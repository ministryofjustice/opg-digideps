name: "[Slack] Send slack notification"

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      success:
        description: "Job status"
        required: true
        type: string
      branch:
        description: "Branch of the workflow"
        required: true
        type: string
      account:
        description: "Account id to use"
        required: true
        type: string
      scheduled_task:
        description: "Name of scheduled task if notification comes from a scheduled task"
        required: false
        default: ""
        type: string
      failure_reason:
        description: "Reason for Failed Workflow. Will update Slack Message."
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read
  security-events: none
  pull-requests: none

jobs:
  send-slack-notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies
        working-directory: lambdas/functions/monitor_notify_lambda
        run: |
          uv export --locked -o requirements.txt
          python -m pip install --no-cache-dir -r requirements.txt

      - name: configure OIDC AWS credentials for slack notification
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::${{ inputs.account }}:role/digideps-gh-actions-slack-notifier
          role-session-name: github-actions-slack-notifier
          role-duration-seconds: 900
          aws-region: eu-west-1

      - name: Notify Slack
        env:
          BRANCH: ${{ inputs.branch }}
          SUCCESS: ${{ inputs.success }}
          SCHEDULED_TASK: ${{ inputs.scheduled_task }}
          FAILURE_REASON: ${{ inputs.failure_reason }}
        run: |
          python ci_monitor_notify.py \
            --success "${SUCCESS}" \
            --commit_message "$(git log -1 --pretty=%B)" \
            --branch "${BRANCH}" \
            --scheduled_task "${SCHEDULED_TASK}" \
            --failure_reason "${FAILURE_REASON}"
        working-directory: lambdas/functions/monitor_notify_lambda/app

      - name: Unset AWS variables
        if: always()
        run: |
          {
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"
