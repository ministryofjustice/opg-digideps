name: "[Style] PHP-CS-Fixer"

on:
  workflow_call:

permissions: {}

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed PHP files to see if we should skip
        run: |
          {
            echo "CHANGED_PHP_FILES<<EOF"
            git diff --diff-filter=d --name-only origin/main... -- '**/*.php'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Run php-cs-fixer
        if: env.CHANGED_PHP_FILES != ''
        run: make check-php-cs-fixer
