on:
  workflow_call:
    secrets:
      ssh_private_key:
        required: true
    inputs:
      workspace:
        description: "Workspace"
        required: true
        type: string
      account_name:
        required: true
        type: string
        description: "Account name for oidc"
      account_id:
        required: false
        default: "${{ vars.DEVELOPMENT_ACCOUNT }}"
        type: string
        description: "Account to get credentials for"
      task_name:
        description: "Name of the task to run"
        required: true
        type: string
      timeout:
        description: "Timeout for the task"
        required: false
        default: 120
        type: string
      oidc_timeout:
        description: "Timeout for the task"
        required: false
        default: 3600
        type: string
      override:
        description: "Override for the task"
        required: false
        default: ""
        type: string
      hide_logs:
        description: "Hide log output"
        required: false
        default: false
        type: boolean
      retry_on_fail:
        description: "Retry on fail"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  security-events: none
  pull-requests: none

env:
  HELPER_VERSION: "0.10.4"

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - id: terraform_version
        name: get terraform version
        uses: ministryofjustice/opg-github-actions/actions/terraform-version@2186f4ee10b7f2839e0c795dcd01c729e6d1d4c0 # v4.8.1
        with:
          terraform_directory: terraform/environment

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.terraform_version.outputs.version }}
          terraform_wrapper: false

      - name: cache ecs-helper
        id: cache-ecs-helper
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ecs-helper
          key: ecs-helper-${{ env.HELPER_VERSION }}

      - name: get ecs-helper
        if: steps.cache-ecs-helper.outputs.cache-hit != 'true'
        run: |
          wget "https://github.com/ministryofjustice/opg-ecs-helper/releases/download/v$HELPER_VERSION/opg-ecs-helper_Linux_x86_64.tar.gz"
          mkdir ecs-helper
          tar -xvf opg-ecs-helper_Linux_x86_64.tar.gz -C ecs-helper
          chmod +x ecs-helper/ecs-runner

      - id: deploy-key
        uses: "ministryofjustice/opg-github-actions/actions/github-deploy-key@9e756945a9e2b6ac5dc81473b01f8b38600e6ed6" # v4.8.6
        with:
          deploy_key: ${{ secrets.ssh_private_key }}

      - name: configure OIDC AWS credentials for terraform
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: "arn:aws:iam::${{ vars.IDENTITY_ACCOUNT }}:role/oidc-digideps-${{ inputs.account_name }}"
          role-session-name: github-actions-terraform
          role-duration-seconds: 900
          aws-region: eu-west-1

      - name: terraform init
        env:
          TF_WORKSPACE: ${{ inputs.workspace }}
        run: terraform init
        working-directory: terraform/environment

      - name: terraform output
        env:
          TF_WORKSPACE: ${{ inputs.workspace }}
        run: |
          echo "$TF_WORKSPACE"
          terraform output -json > terraform.output.json
        working-directory: terraform/environment

      - name: configure OIDC AWS credentials for gh run task
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/digideps-gh-actions-run-task"
          role-session-name: github-actions-terraform-run-task
          role-duration-seconds: ${{ inputs.oidc_timeout }}
          aws-region: eu-west-1

      - name: run task
        env:
          OVERRIDE: ${{ inputs.override }}
          TASK_NAME: ${{ inputs.task_name }}
          TIMEOUT: ${{ inputs.timeout }}
          HIDE_LOGS: ${{ inputs.hide_logs }}
          RETRY_ON_FAIL: ${{ inputs.retry_on_fail }}
        run: |
          echo "${TASK_NAME}"
          echo "${TIMEOUT}"
          echo "${OVERRIDE}"

          run_task() {
            if [ -z "${OVERRIDE}" ]; then
              ../../ecs-helper/ecs-runner -task "${TASK_NAME}" -timeout "${TIMEOUT}" -assumeRoleFromTFOut false -hideLogs "${HIDE_LOGS}"
            else
              ../../ecs-helper/ecs-runner -task "${TASK_NAME}" -timeout "${TIMEOUT}" -override "${OVERRIDE}" -assumeRoleFromTFOut false -hideLogs "${HIDE_LOGS}"
            fi
          }
          run_task
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ] && [ "${RETRY_ON_FAIL}" = "true" ]; then
            echo "First attempt failed, retrying once..."
            run_task
            EXIT_CODE=$?
          fi
          exit $EXIT_CODE
        working-directory: terraform/environment

      - name: Unset AWS variables
        if: always()
        run: |
          {
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"
