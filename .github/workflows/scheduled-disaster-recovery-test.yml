name: "[Scheduled] Run test restores on Preproduction"

on:
  schedule:
    # 2pm every Saturday
    - cron: "0 14 * * 6"

permissions: {}

jobs:
  restore_from_local_restore_point:
    runs-on: ubuntu-latest
    name: restore to a point in time
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install dependencies
        working-directory: disaster-recovery/restore
        run: uv sync --locked

      - name: configure OIDC AWS credentials for terraform
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: "arn:aws:iam::${{ vars.IDENTITY_ACCOUNT }}:role/oidc-digideps-preproduction"
          role-session-name: github-actions-terraform-run-task
          role-duration-seconds: 7200
          aws-region: eu-west-1

      - name: restore from cross account backup
        id: restore
        run: |
          python3 database_restore.py \
          --environment preproduction \
          --cluster_from digideps-preproduction \
          --aws_backup True \
        working-directory: disaster-recovery/restore

      - name: Unset AWS variables
        if: always()
        run: |
          {
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"

  restore_from_remote_restore_point:
    runs-on: ubuntu-latest
    name: restore from cross account backup
    permissions:
      id-token: write
    needs:
      - restore_from_local_restore_point
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install dependencies
        working-directory: disaster-recovery/restore
        run: uv sync --locked

      - name: configure OIDC AWS credentials for terraform
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: "arn:aws:iam::${{ vars.IDENTITY_ACCOUNT }}:role/oidc-digideps-preproduction"
          role-session-name: github-actions-terraform-run-task
          role-duration-seconds: 7200
          aws-region: eu-west-1

      - name: restore from remote backup
        id: restore
        run: |
          python3 database_restore.py \
          --environment preproduction \
          --cluster_from digideps-preproduction \
          --aws_backup True \
          --restore_from_remote True
        working-directory: disaster-recovery/restore

      - name: Unset AWS variables
        if: always()
        run: |
          {
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"

  slack_notify_success:
    name: notify of result
    uses: $/.github/workflows/_slack-notification.yml
    permissions:
      id-token: write
    needs:
      - restore_from_remote_restore_point
    with:
      success: yes
      branch: integration
      account: ${{ vars.DEVELOPMENT_ACCOUNT }}

  slack_notify_failure:
    name: notify of failure
    uses: $/.github/workflows/_slack-notification.yml
    permissions:
      id-token: write
    if: ${{ failure() }}
    needs:
      - restore_from_remote_restore_point
    with:
      success: no
      branch: integration
      account: ${{ vars.DEVELOPMENT_ACCOUNT }}
