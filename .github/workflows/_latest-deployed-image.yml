on:
  workflow_call:
    secrets:
      ssh_private_key:
        required: true
    inputs:
      terraform_path:
        description: "The name of the terraform path"
        required: true
        type: string
      workspace:
        description: "Terraform workspace"
        required: true
        type: string
      account_name:
        description: "Terraform account name"
        required: true
        type: string
    outputs:
      image_tag:
        description: "The latest version image tag"
        value: ${{ jobs.export_image_tag.outputs.image_tag }}

permissions:
  id-token: write
  contents: read
  security-events: none
  pull-requests: none

jobs:
  export_image_tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.export_tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: "0"

      - id: terraform_version
        name: get terraform version
        uses: ministryofjustice/opg-github-actions/actions/terraform-version@2186f4ee10b7f2839e0c795dcd01c729e6d1d4c0 # v4.8.1
        with:
          terraform_directory: terraform/${{ inputs.terraform_path }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.terraform_version.outputs.version }}
          terraform_wrapper: false

      - id: deploy-key
        uses: ministryofjustice/opg-github-actions/actions/github-deploy-key@9e756945a9e2b6ac5dc81473b01f8b38600e6ed6 # v4.8.6
        with:
          deploy_key: ${{ secrets.ssh_private_key }}

      - name: configure OIDC AWS credentials for latest deployment
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.IDENTITY_ACCOUNT }}:role/oidc-digideps-${{ inputs.account_name }}
          role-session-name: github-actions-slack-notifier
          role-duration-seconds: 900
          aws-region: eu-west-1

      - name: terraform init
        run: terraform init -input=false
        working-directory: terraform/${{ inputs.terraform_path }}

      - name: export latest image
        id: export_tag
        env:
          TF_WORKSPACE: ${{ inputs.workspace }}
        run: |
          IMAGE_TAG=$(terraform show -json | head -n 2 | tail -n 1 | jq -r '.values.root_module.child_modules[].resources[] | select(.address == "module.eu_west_1[0].aws_ecs_task_definition.front") | .values.container_definitions | fromjson[].image | split(":")[1]' | tail -n 1 2>/dev/null)

          if [ -n "${IMAGE_TAG}" ]; then
            echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          fi
        working-directory: terraform/${{ inputs.terraform_path }}

      - name: Unset AWS variables
        if: always()
        run: |
          {
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"
