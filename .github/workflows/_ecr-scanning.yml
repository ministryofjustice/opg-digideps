name: "[AWS] ECR scanning results"

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag for which to check scanning results"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  security-events: write
  pull-requests: none

jobs:
  ecr-scan-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install dependencies
        working-directory: scripts/pipeline/ecrscan
        run: uv sync --locked

      - name: configure OIDC AWS credentials for ECR scanning
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT }}:role/digideps-gh-actions-ecr-scan
          role-session-name: github-actions-ecr-scan
          role-duration-seconds: 1800
          aws-region: eu-west-1

      - name: Check ECR scan results
        env:
          TAG: ${{ inputs.tag }}
        run: python ./scripts/pipeline/ecrscan/ecr_scan_results.py --search digideps --ignore mock-sirius --tag "${TAG}" --print_to_terminal --fail_pipe

      - name: Unset AWS variables
        if: always()
        run: |
          {
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"
