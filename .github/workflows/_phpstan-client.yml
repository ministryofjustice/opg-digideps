name: "[Tests] Client PHPStan"

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      branch_name:
        description: "Name of the branch doing the build"
        required: true
        type: string

permissions: {}

jobs:
  client-phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: set up docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: cache docker layers
        id: cache-docker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.buildx-cache
          key: client-phpstan-${{ inputs.branch_name }}-${{ github.sha }}
          restore-keys: |
            client-phpstan-${{ inputs.branch_name }}
            client-phpstan-main

      - name: build docker images
        run: |
          docker buildx build \
          -f client/docker/app/Dockerfile \
          --cache-from=type=local,src=/tmp/.buildx-cache \
          --cache-to=type=local,dest=/tmp/.buildx-cache-new \
          --build-arg LOCAL_RESOURCES=true \
          --tag client-phpstan:latest \
          --target devtools-admin \
          --output type=docker .

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: run client phpstan
        id: client-phpstan
        run: |
          make phpstan-client
