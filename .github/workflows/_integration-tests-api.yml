name: "[Tests] API Integration Tests"

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      selection:
        description: "api tests selection to run"
        required: true
        type: string
      branch_name:
        description: "Name of the branch doing the build"
        required: true
        type: string

permissions: {}
jobs:
  api-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: set up docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: cache docker layers
        id: cache-docker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.buildx-cache
          key: api-integration-tests-${{ inputs.branch_name }}-${{ github.sha }}
          restore-keys: |
            api-integration-tests-${{ inputs.branch_name }}
            api-integration-tests-main

      - name: build docker images
        run: |
          success=0
          for i in 1 2; do
            echo "Starting attempt $i"

            if docker buildx build \
              -f api/docker/app/Dockerfile \
              --cache-from=type=local,src=/tmp/.buildx-cache \
              --cache-to=type=local,dest=/tmp/.buildx-cache-new \
              --build-arg LOCAL_RESOURCES=true \
              --tag api-integration-tests:latest \
              --target devtools-admin \
              --output type=docker .; then
              success=1
              break
            fi

            sleep 1
          done
          [ "$success" -eq 1 ] || exit 1

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: run api integration tests
        env:
          SELECTION: ${{ inputs.selection }}
        id: integration-tests
        run: |
          success=0
          for i in 1 2; do
            echo "Starting attempt $i"

            if make api-integration-tests ADDITIONAL_CONFIG="" INTEGRATION_SELECTION=${SELECTION}; then
              success=1
              break
            fi

            sleep 1
          done
          [ "$success" -eq 1 ] || exit 1

      - name: archive test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-integration-tests-${{ inputs.selection }}
          path: api/app/tests/coverage/api-integration-tests-${{ inputs.selection }}.xml
