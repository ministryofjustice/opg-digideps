on:
  workflow_call:
    secrets:
      ssh_private_key:
        required: true
    inputs:
      terraform_path:
        description: "The name of the terraform path"
        required: true
        type: string
      workspace:
        description: "Terraform workspace"
        required: true
        type: string
      container_version:
        description: "Image tag to use"
        required: false
        type: string
        default: ""
      apply:
        description: "Whether to apply terraform"
        required: false
        type: boolean
        default: false
      pull_request_path:
        description: "Called from pull request"
        required: false
        type: boolean
        default: false
      account_name:
        required: true
        type: string
        description: "Account to get credentials for"

permissions:
  id-token: write
  contents: read
  security-events: none
  pull-requests: none

jobs:
  terraform_workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: python layers folder
        if: inputs.terraform_path == 'account'
        run: pip3 install -r requirements.txt --target ./layers/python/lib/python3.14/site-packages/
        working-directory: lambdas/functions/monitor_notify_lambda

      - id: terraform_version
        name: get terraform version
        uses: ministryofjustice/opg-github-actions/actions/terraform-version@ceeda9d30ec7f6705c819d0b7664b9a79df99a3b # v4.8.0
        with:
          terraform_directory: terraform/${{ inputs.terraform_path }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.terraform_version.outputs.version }}
          terraform_wrapper: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: inputs.terraform_path == 'account'
        with:
          go-version: "1.26.2"

      # requires go 1.25.5
      - name: build redeployer
        if: inputs.terraform_path == 'account'
        run: GOARCH=amd64 GOOS=linux go build -o bootstrap ./main.go
        working-directory: terraform/account/region/go_redeployer

      - id: terraform_workspace_manager
        if: inputs.apply && inputs.terraform_path == 'environment' && inputs.pull_request_path
        name: register workspace
        uses: ministryofjustice/opg-github-actions/actions/terraform-workspace-manager@ceeda9d30ec7f6705c819d0b7664b9a79df99a3b # v4.8.0
        with:
          aws_account_id: ${{ vars.DEVELOPMENT_ACCOUNT }}
          aws_iam_role: digideps-ci
          register_workspace: ${{ inputs.workspace }}
          time_to_protect: 3
          oidc_role: arn:aws:iam::${{ vars.DEVELOPMENT_ACCOUNT }}:role/digideps-gh-actions-workspace-cleanup
          assume_role: false

      - id: deploy-key
        uses: ministryofjustice/opg-github-actions/actions/github-deploy-key@f90a91695b7d02fe2b4133ba2f9ebc2c0f6b8f94 # v4.8.5
        with:
          deploy_key: ${{ secrets.ssh_private_key }}

      - name: configure OIDC AWS credentials for terraform
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: "arn:aws:iam::${{ vars.IDENTITY_ACCOUNT }}:role/oidc-digideps-${{ inputs.account_name }}"
          role-session-name: github-actions-terraform
          role-duration-seconds: 7400
          aws-region: eu-west-1

      - name: terraform init for account
        if: inputs.terraform_path == 'account'
        run: terraform init -input=false
        env:
          TF_WORKSPACE: ${{ inputs.workspace }}
        working-directory: terraform/${{ inputs.terraform_path }}

      - name: terraform init for environment
        run: terraform init -input=false
        if: inputs.terraform_path == 'environment'
        working-directory: terraform/${{ inputs.terraform_path }}

      - name: terraform plan ${{ inputs.terraform_path }}
        env:
          TF_WORKSPACE: ${{ inputs.workspace }}
          TF_VAR_OPG_DOCKER_TAG: ${{ inputs.container_version }}
        run: |
          terraform workspace show
          terraform plan -input=false -parallelism=30 -lock-timeout=5m
        working-directory: terraform/${{ inputs.terraform_path }}

      - name: terraform apply ${{ inputs.terraform_path }}
        if: inputs.apply
        env:
          TF_WORKSPACE: ${{ inputs.workspace }}
          TF_VAR_OPG_DOCKER_TAG: ${{ inputs.container_version }}
          CI: true
        run: |
          terraform apply -lock-timeout=300s -input=false -auto-approve -parallelism=30
        working-directory: terraform/${{ inputs.terraform_path }}

      - name: Unset AWS variables
        if: always()
        run: |
          {
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"
