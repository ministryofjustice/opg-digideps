on:
  workflow_call:
    inputs:
      account_environment:
        description: "Environment to run against"
        required: true
        type: string
      secret_type:
        description: "Secret type to rotate [app, database]"
        required: true
        type: string

permissions:
  id-token: write

jobs:
  cycle_secrets_for_env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install dependencies
        working-directory: terraform/environment/scripts/cycle_secrets
        run: uv sync --locked

      - name: configure OIDC AWS credentials for terraform
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: "arn:aws:iam::${{ vars.IDENTITY_ACCOUNT }}:role/oidc-digideps-${{ inputs.account_environment }}"
          role-session-name: github-actions-cycle-secrets
          role-duration-seconds: 3600
          aws-region: eu-west-1

      - name: cycle secrets
        env:
          ACCOUNT_ENVIRONMENT: ${{ inputs.account_environment }}
          SECRET_TYPE: ${{ inputs.secret_type }}
          AWS_REGION: eu-west-1
        working-directory: terraform/environment/scripts/cycle_secrets
        run: python3 cycle_secrets.py "${ACCOUNT_ENVIRONMENT}" "${SECRET_TYPE}"

      - name: Unset AWS variables
        if: always()
        run: |
          {
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"
