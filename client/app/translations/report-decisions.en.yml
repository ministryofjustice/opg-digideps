startPage:
  htmlTitle: "Decisions - Complete the deputy report | GOV.UK"
  pageTitle: Decisions
  startButton: Start decisions
  description1: "Use this section to tell us about %client%'s mental capacity to make decisions and the significant decisions you've made on %client%'s behalf." 

  header1: Before you start 

  description2: "To complete this section, have ready any:" 

