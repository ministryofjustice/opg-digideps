        I confirm I have had regard to the Mental Capacity Act 2005, its Code of Practice, the [Deputy standards (opens in new tab)](https://www.gov.uk/government/publications/opg-deputy-standards-guidance-for-lay-deputies/guidance-for-lay-deputies), and the court order in this case. I understand the duties and obligations placed on me.
