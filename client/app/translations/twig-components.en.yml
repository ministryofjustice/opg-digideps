opg:
  accessibility:
    statement:
      content: |
        This accessibility statement applies to the Complete the deputy report service. This website is run by the [Office of the Public Guardian](https://www.gov.uk/government/organisations/office-of-the-public-guardian). We want as many people as possible to be able to use this service.

        For example, that means you should be able to:

        - change colours, contrast levels and fonts using accessibility software you have installed on your computer
        - zoom in up to 300% without the text spilling off the screen
        - navigate most of the website using just a keyboard
        - navigate most of the website using speech recognition software
        - listen to most of the website using a screen reader (including the most recent versions of JAWS, NVDA and VoiceOver)

        We’ve also made the service text as simple as possible to understand.

        [AbilityNet](https://mcmw.abilitynet.org.uk/) has advice on making your device easier to use if you have a disability.

        # Feedback and contact information

        We’re always looking to improve the accessibility of this service. If you find any problems not listed on this page or think we’re not meeting accessibility requirements, contact:

        - Email: [%emailAddress%](mailto:%emailAddress%)
        - Telephone: %telephoneNumber%
        - Textphone: %textphoneNumber%

        We are available %openingHours%.

        If you cannot use this service, you can [complete your deputy report using a paper form](https://www.gov.uk/government/publications/deputy-annual-report-accounting-for-your-actions).

        If you need the form in a more accessible format, email [%customerServiceEmail%](mailto:%customerServiceEmail%) and tell us which format you need.

        # Enforcement procedure

        The Equality and Human Rights Commission (EHRC) is responsible for enforcing the Public Sector Bodies (Websites and Mobile Applications) (No. 2) Accessibility Regulations 2018 (the ‘accessibility regulations’). If you’re not happy with how we respond to your complaint, [contact the Equality Advisory and Support Service (EASS)](https://www.equalityadvisoryservice.com/).

        # Technical information about this website’s accessibility

        The Office of the Public Guardian is committed to making its online services accessible, in accordance with the Public Sector Bodies (Websites and Mobile Applications) (No. 2) Accessibility Regulations 2018.

        # Compliance status

        The website has been tested against the Web Content Accessibility Guidelines (WCAG) 2.2 AA standard.

        This website is fully compliant with the [Web Content Accessibility Guidelines version 2.2](https://www.w3.org/TR/WCAG22/) AA standard.

        # Preparation of this accessibility statement

        This statement was prepared on 26 October 2026. It was last reviewed on 26 October 2026.

        This website was last tested on 06 February 2026 against the WCAG 2.2 AA standard.

        The test was carried out by Uservision. You can [read the full accessibility test report](https://uv3327-moj-digideps-spotcheck.uservisionaccessibility.co.uk/index.html). All WCAG failures identified in this test have been resolved and the website is currently awaiting a further test.
      header: Accessibility statement for the Complete the deputy report service
      title: Accessibility Statement | GOV.UK
