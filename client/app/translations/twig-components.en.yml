        For help registering or signing in, contact the Office of the Public Guardian (OPG) on %telephoneNumber%.
      signIn: sign in
      errors:
        AccountTaken: |
          Our records show that an account already exists for this deputyship.
          Please sign in using your registered email address. Please call %telephoneNumber% if you are unable to sign in.
        EmailError: An error occurred while setting up your account. Please try again later.
        MatchingError: |
          The information you've given us does not match our records.
          Please call %telephoneNumber% to make sure we have a record of your deputyship.
        NetworkError: An error occurred while setting up your account. Please try again later.
    created:
      notice: Set a password to activate your account with the Complete the deputy report service.
      content: |
        # What happens next

        To activate your account, you must set a password. The Office of the Public Guardian (OPG) has emailed you a link to set your password. This link will remain valid for 1 hour.

        If you don’t receive an email or the link expires, you can [return to the registration page](%registrationPath%) to request a new link.
    password:
      content: |-
        To %action% your password, type your %quality% password in the box below and then confirm the password in the second box.
        Your password must have:
        - at least 14 characters
        - at least 1 uppercase letter
        - at least 1 lowercase letter
        - at least 1 number
      reset:
        action: reset
        quality: new
      set:
        action: set
        quality: desired
      form:
        notBlank: "You cannot leave this blank: please enter a password"
        doesNotMatch: The passwords you entered do not match.
        tooShort: The password must have at least 14 characters
        tooLong: The password cannot be longer than 50 characters
        tooCommon: Your password is too easy for someone to guess. Please choose a different password.
        noLowercase: The password must have at least one lowercase letter
        noUppercase: The password must have at least one capital letter
        noNumber: The password must have at least one number
        label:
          first: Password
          second: Confirm password
        submit: Save password
      errors:
        NetworkError: An error occurred while setting up your account. Please try again later.
        TokenInvalid: This link is no longer valid. Please wait at least one minute, then try again using the most recent link the Office of the Public Guardian (OPG) emailed you.
        TokenExpired: This link is expired. Please generate a new link.
